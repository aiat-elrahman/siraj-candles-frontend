<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#BE185D">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siraj Candles</title>
    <meta name="description" content="Handcrafted candles and home fragrance from Siraj Candles.">
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="assets/js/tracking.js" defer></script>

<body data-page="landing">

    <div class="announcement-ribbon" id="announcement-ribbon"></div>

    <nav class="navbar">
        <div class="container">
            <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Open navigation menu">
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>

            <a href="index.html" class="logo">
                <span class="logo-siraj">SIRAJ</span>
                <span class="logo-candles">CANDLES</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="products.html"><i class="fas fa-box-open"></i> Products</a></li>
                <li><a href="bundles.html"><i class="fas fa-gift"></i> Bundles</a></li>
                <li><a href="order-tracking.html"><i class="fas fa-truck"></i> Track Order</a></li>
            </ul>

            <div class="nav-icons">
                <button id="search-toggle" aria-label="Search"><i class="fas fa-search"></i></button>
                <button id="cart-toggle" class="cart-icon-button" aria-label="View cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" style="visibility: hidden; opacity: 0;">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="mobile-nav-menu" id="mobile-nav-menu"></div>

    <div id="cart-dropdown" class="cart-dropdown">
        <h3 class="dropdown-header">Your Cart</h3>
        <div class="cart-items-list"></div>
        <div class="cart-summary"><p>Total: <span id="cart-total">0.00 EGP</span></p></div>
        <div class="cart-dropdown-actions">
            <a href="shopcart.html" class="view-cart-btn">View Cart</a>
            <a href="checkout.html" class="checkout-btn-small">Checkout</a>
        </div>
    </div>

    <div id="search-modal" class="search-modal"><div class="search-content">
        <button class="close-search">&times;</button>
        <input type="text" id="search-input" placeholder="Search for product name or category...">
        <div id="search-results" class="search-results"></div>
    </div></div>

    <main id="landing-root" class="lp-root">
        <p class="lp-loading">Loading…</p>
    </main>

    <div class="lp-sticky" id="lp-sticky" hidden>
        <a href="#lp-products" class="lp-sticky-shop" id="lp-sticky-shop">Shop Now</a>
        <a href="checkout.html" class="lp-sticky-cart" id="lp-sticky-cart" aria-label="Go to checkout">
            <i class="fas fa-shopping-cart"></i> <span id="lp-sticky-count">0</span>
        </a>
    </div>

    <footer class="footer">
        <p>Email us for <strong>bulk orders</strong> and <strong>customized gifts</strong>: <a href="mailto:orders@sirajcandles.com" class="email-btn">orders@sirajcandles.com</a></p>
        <p style="margin-top: 15px;"><a href="order-tracking.html" style="font-weight: 600; text-decoration: underline;">Track Your Order Here</a></p>
        <p>&copy; 2025 Siraj Candles. All rights reserved.</p>
        <div class="social-links">
            <a href="https://www.instagram.com/siraj_candles_eg" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/people/sirajcandles/61576576972784/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.tiktok.com/@sirajcandles" target="_blank" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>
        <p>From our Home to Yours ❤️</p>
